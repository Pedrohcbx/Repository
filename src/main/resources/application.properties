spring.application.name=room-reservations

spring.datasource.url=jdbc:postgresql://${POSTGRES_ROOM_HOST}:${POSTGRES_ROOM_PORT}/${POSTGRES_ROOM_DB}
spring.datasource.username=${POSTGRES_ROOM_USER}
spring.datasource.password=${POSTGRES_ROOM_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

server.port=8080

